<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#245B52">
<title>PIZZA – Parkinson’s home activity coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PIZZA">
<style>
:root{--bg:#F7F7F2;--sf:#fff;--ink:#26332F;--mu:#5f6f68;--ln:#dfe5df;--pr:#245B52;--pr2:#9BB9A8;--tint:#e6efe9;--wn:#8a5a00;--wnbg:#fbf0d4;--dg:#b3261e;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141d1a;--sf:#1e2a26;--ink:#e9f0ea;--mu:#a5b5ad;--ln:#30403a;--pr:#7fc8b5;--pr2:#4d7a6c;--tint:#25362f;--wn:#f0c45e;--wnbg:#3a3319;--dg:#ff8a80;--on:#10201b}}
:root[data-theme="dark"]{--bg:#141d1a;--sf:#1e2a26;--ink:#e9f0ea;--mu:#a5b5ad;--ln:#30403a;--pr:#7fc8b5;--pr2:#4d7a6c;--tint:#25362f;--wn:#f0c45e;--wnbg:#3a3319;--dg:#ff8a80;--on:#10201b}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Thonburi","Leelawadee UI",sans-serif;font-size:1.0625rem;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:20px 18px 120px}
h1{font-size:1.7rem;line-height:1.25;margin:4px 0 6px}h2{font-size:1.25rem;margin:26px 0 10px}h3{font-size:1.1rem;margin:0}
.mu{color:var(--mu);font-size:.95rem}.row{display:flex;gap:12px;align-items:center}.g{flex:1}.sp{height:10px}
.bx{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:0 0 12px}
button,.bt{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 20px;min-height:52px;background:var(--pr);color:var(--on);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--pr2);outline-offset:2px}
.bt.ln,button.ln{background:transparent;color:var(--ink);border:2px solid var(--ln)}.bt.dg,button.dg{background:var(--dg);color:#fff}
.w{width:100%}button:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:.85rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--pr)}.tag.w2{background:var(--wnbg);color:var(--wn)}
.note{background:var(--wnbg);color:var(--ink);border-left:5px solid var(--wn);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:.97rem}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;flex-direction:column;gap:2px;background:none;color:var(--mu);font-size:.78rem;min-height:58px;padding:6px 2px;border-radius:10px}
.nav button.on{color:var(--pr);background:var(--tint)}.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){.nav{top:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:20px 10px;gap:6px}.nav button{flex:none;flex-direction:row;justify-content:flex-start;font-size:1rem;padding:10px 14px;min-height:52px}main{margin-left:230px;max-width:760px}}
.stage{background:#fbfbf7;border:1px solid var(--ln);border-radius:18px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;max-height:56vh;height:auto}.stage.mini svg{max-height:200px}
.cap{font-size:1.15rem;font-weight:600;min-height:3.4em;padding:10px 4px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.ctl button{min-height:48px;padding:8px 16px}
.seg{display:inline-flex;border:2px solid var(--ln);border-radius:12px;overflow:hidden}.seg button{border-radius:0;background:transparent;color:var(--ink);min-height:44px;padding:6px 12px}.seg button.on{background:var(--pr);color:var(--on)}
input[type=range]{width:100%;accent-color:var(--pr);height:32px}
.jt{display:none}.det .jt{display:block;fill:#fff;stroke:#245B52;stroke-width:3}
.bar{height:12px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.th{width:84px;height:104px;border-radius:12px;background:#fbfbf7;border:1px solid var(--ln);flex:none;overflow:hidden}.th svg{width:100%;height:100%}
.big{font-size:2.4rem;font-weight:700;line-height:1.1}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0}.chk input{width:26px;height:26px;margin-top:2px;accent-color:var(--pr);flex:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:20px}.ov .bx{max-width:420px;width:100%}
.logo{font-weight:700;letter-spacing:.14em;color:var(--pr);font-size:1.1rem}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0}.dots i{width:10px;height:10px;border-radius:9px;background:var(--ln)}.dots i.on{background:var(--pr);width:26px}
a.lk{color:var(--pr);font-weight:600}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ===== v0.2 visual refinement ===== */
body{background:var(--bg);-webkit-font-smoothing:antialiased}
main{padding-top:28px}
h1{font-size:clamp(1.85rem,6vw,2.3rem);letter-spacing:-.01em;margin:6px 0 8px}
h2{font-size:1.3rem;margin:34px 0 12px;color:var(--ink);display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:22px;border-radius:4px;background:var(--pr2);flex:none}
.mu{line-height:1.6}
.bx{border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(20,40,35,.05),0 10px 24px -14px rgba(20,40,35,.22);transition:transform .15s,box-shadow .15s}
button,.bt{border-radius:16px;font-size:1.05rem;box-shadow:0 2px 0 rgba(0,0,0,.16);transition:transform .08s,box-shadow .15s,filter .15s}
button:active,.bt:active{transform:translateY(2px);box-shadow:none}
button.ln,.bt.ln,.nav button,.seg button{box-shadow:none}
.tag{font-size:.88rem;padding:3px 12px;border:1px solid transparent}
.tag.w2{border-color:rgba(138,90,0,.25)}
.stage{background:#f3f6f1;border-radius:24px;border:1px solid var(--ln);box-shadow:inset 0 -26px 0 -14px rgba(155,185,168,.28)}
.cap{font-size:1.2rem;text-align:center;color:var(--pr)}
.th{border-radius:16px;background:#f3f6f1}
.nav{box-shadow:0 -6px 20px -12px rgba(20,40,35,.25);border-top:0}
.nav button{border-radius:14px;font-weight:600}
.nav button.on{background:var(--pr);color:var(--on)}
.nav svg{stroke-width:2.2}
.logo{font-size:1.25rem;letter-spacing:.18em;display:flex;align-items:center;gap:10px}
.logo::before{content:"";width:30px;height:30px;border-radius:10px;background:var(--pr);box-shadow:inset 0 0 0 7px var(--pr),inset 0 0 0 9px var(--on);opacity:.95}
.bar{height:14px}.bar i{border-radius:9px;transition:width .5s}
.big{color:var(--pr);letter-spacing:-.02em}
.note{border-radius:14px;border-left-width:6px}
.ov .bx{border-radius:24px}
@media(min-width:900px){main{padding-top:40px}.nav button.on{background:var(--tint);color:var(--pr)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>*{animation:rise .35s ease both}
@media(prefers-reduced-motion:reduce){main>*{animation:none}button,.bt,.bx{transition:none}}
/* ===== camera session ===== */
.cam{position:relative;border-radius:24px;overflow:hidden;background:#101816;border:1px solid var(--ln)}
.cam video{display:block;width:100%;max-height:56vh;aspect-ratio:4/3;object-fit:contain;transform:scaleX(-1)}
.cam .qi{position:absolute;left:12px;top:12px}.tag.qi.good{background:var(--pr);color:var(--on)}
</style>
</head>
<body>
<main id="main" tabindex="-1"></main>
<nav class="nav" id="nav" aria-label="Main menu"></nav>
<script src="vendor/pizza-core.iife.js"></script>
<script src="app.js"></script>
</body>
</html>
