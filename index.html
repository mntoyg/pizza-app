html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:100%}

function makeFig(view){
 const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 300 340");s.setAttribute("role","img");s.setAttribute("aria-label","ตัวละครสาธิตท่าออกกำลังกาย");

 const q=c=>s.querySelector(c),qa=c=>[...s.querySelectorAll(c)],r=d=>d*Math.PI/180,T=(e,v)=>e&&e.setAttribute("transform",v);
 const f={el:s,view,trail:null,apply(p){
  if(view=="front"){
   const th=Math.max(16,82*Math.cos(r(p.h))),sh=Math.max(10,78*Math.cos(r(p.h-p.k)));
   T(q("#bd"),`translate(0 ${-(th+sh+8)})`);
   [0,1].forEach(i=>{q("#t"+i).setAttribute("height",th);const a=q("#s"+i);a.setAttribute("y",th);a.setAttribute("height",sh);q("#f"+i).setAttribute("cy",th+sh)});
   const tw=r(p.tw),fo=1-p.fold;T(q("#tr"),`scale(${Math.cos(tw)} 1)`);T(q("#hd"),`translate(${Math.sin(tw)*10} 0)`);
   const e=p.el*(1-.2*p.fold);
   const fz=a=>p.fwd?` scale(1 ${Math.max(.3,Math.cos(r(a))).toFixed(3)})`:"";T(q("#A0"),`translate(-27 -98) rotate(${p.fwd?0:p.shL*fo})${fz(p.shL)}`);T(q("#A1"),`translate(27 -98) rotate(${p.fwd?0:-p.shR*fo})${fz(p.shR)}`);
   T(q("#A0f"),`translate(0 58) rotate(${-e})`);T(q("#A1f"),`translate(0 58) rotate(${e})`);
   q("#chair").setAttribute("opacity",p.h>1?1:.0);
  }else{
   const px=-(82*Math.sin(r(p.h))+78*Math.sin(r(p.h-p.k))),py=-(82*Math.cos(r(p.h))+78*Math.cos(r(p.h-p.k))+8);
   T(q("#bd"),`translate(${px} ${py})`);
   qa(".tg").forEach(e=>T(e,`rotate(${-p.h})`));qa(".sg").forEach(e=>T(e,`translate(0 82) rotate(${p.k})`));qa(".fg").forEach(e=>T(e,`translate(0 78) rotate(${p.h-p.k})`));
   T(q("#tr"),`rotate(${p.lean}) scale(${1+.35*Math.abs(Math.sin(r(p.tw)))} 1)`);
   T(q("#nr"),`translate(0 -98) rotate(${-p.shR})`);T(q("#far"),`translate(0 -98) rotate(${-p.shL})`);
   T(q("#nrf"),`translate(0 58) rotate(${-p.el})`);T(q("#farf"),`translate(0 58) rotate(${-p.el})`);

 };return f}

  const g=fig.el.querySelector("#trail");const ns="http://www.w3.org/2000/svg";

 function loop(ts){if(!stg.isConnected)return;const dt=Math.min(.1,(ts-last)/1000||0);last=ts;if(play){t+=dt*spd;if(t>=ex.dur){t-=ex.dur;capI=-1;o.onLoop&&o.onLoop()}draw()}RAF=requestAnimationFrame(loop)}

  box.querySelector("#sp").onclick=e=>{const v=e.target.dataset.v;if(!v)return;spd=+v;[...e.currentTarget.children].forEach(b=>b.classList.toggle("on",b==e.target))};

 ${fav?`<div class="bx">ท่าที่ฝึกบ่อย: <b>${esc(exOf(fav[0]).name)}</b> (${fav[1]} ครั้ง)</div>`:""}<h2>ประวัติ</h2>${DB.sessions.slice(-15).reverse().map(s=>`<div class="bx"><b>${esc(exOf(s.ex).name)}</b> <span class="tag${s.status=="completed"?"":" w2"}">${s.status=="completed"?"ครบ":"หยุดก่อน"}</span><div class="mu">${new Date(s.start).toLocaleString("th-TH")} · ${fmt(s.dur)} · ${s.reps} ครั้ง</div></div>`).join("")}`},
care(){return `<h1>ผู้ดูแลและนักกายภาพ</h1><div class="note"><b>ข้อมูลตัวอย่างเพื่อสาธิต</b> ยังไม่มีการเชื่อมต่อหรือส่งข้อมูลไปยังบุคคลอื่น ข้อมูลการฝึกอยู่ในเครื่องนี้เท่านั้น</div>
 <div class="bx"><h3>ผู้ดูแล (ตัวอย่าง)</h3><div class="mu">คุณสมศรี · ลูกสาว</div></div><div class="bx"><h3>นักกายภาพ (ตัวอย่าง)</h3><div class="mu">คุณนักกายภาพ ตัวอย่าง · โรงพยาบาลตัวอย่าง</div></div>
 <h2>โปรแกรมที่ได้รับมอบหมาย (ตัวอย่าง)</h2>${EX.map(e=>`<div class="bx row"><div class="g"><b>${e.name}</b><div class="mu">${TARGET} ครั้ง · ${e.sup?"ต้องมีผู้ดูแล":"ฝึกขณะนั่ง"}</div></div><span class="tag w2">ยังไม่ได้รับการตรวจสอบ</span></div>`).join("")}
 <div class="bx"><h3>รายงานสรุป</h3><p class="mu">ในอนาคต ผู้ใช้จะเลือกแชร์สรุปให้นักกายภาพได้เมื่อยินยอมเท่านั้น ตอนนี้ยังไม่เปิดใช้</p><button class="ln w" data-go="prog">ดูประวัติของฉัน</button></div>`},
learn(){return `<button class="ln" data-go="home" style="min-height:44px">‹ กลับ</button><h1>ศูนย์ความรู้</h1><p class="mu">เปิดวิดีโอจากเว็บไซต์ต้นทางโดยตรง PIZZA ไม่คัดลอกหรือฝังวิดีโอ</p>
 ${[["วิดีโอศูนย์ความเป็นเลิศโรคพาร์กินสัน จุฬาฯ","chulapd.org","คลังวิดีโอภาษาไทยเกี่ยวกับโรคพาร์กินสันและการดูแลตนเอง","https://www.chulapd.org/videos","ความรู้ทั่วไป"],["Exercise – Parkinson’s Foundation","parkinson.org","แนวทางและตัวอย่างการออกกำลังกายสำหรับผู้ป่วยพาร์กินสัน (ภาษาอังกฤษ)","https://www.parkinson.org/living-with-parkinsons/treatment/exercise","การออกกำลังกาย"]].map(r=>`<div class="bx"><span class="tag">${r[4]}</span><h3 style="margin-top:6px">${r[0]}</h3><div class="mu">แหล่งที่มา: ${r[1]}</div><p>${r[2]}</p><a class="bt ln w" href="${r[3]}" target="_blank" rel="noopener noreferrer">เปิดเว็บไซต์ต้นทาง ↗</a></div>`).join("")}`},
set(){return `<h1>โปรไฟล์และความเป็นส่วนตัว</h1><div class="bx"><label for="nm"><b>ชื่อที่ให้เรียก</b></label><br><input id="nm" value="${esc(DB.set.name)}" maxlength="30" style="font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--ink);margin-top:6px"></div>
 <div class="bx"><b>ขนาดตัวอักษร</b><div class="ctl"><span class="seg" id="fs">${[["ปกติ",1],["ใหญ่",1.2],["ใหญ่มาก",1.4]].map(a=>`<button data-v="${a[1]}" class="${DB.set.fs==a[1]?"on":""}">${a[0]}</button>`).join("")}</span></div></div>
 <div class="bx"><label class="chk"><input type="checkbox" id="vc" ${DB.set.voice?"checked":""}><span><b>เสียงบรรยายภาษาไทย</b><br><span class="mu">ขึ้นกับเสียงที่เครื่องรองรับ</span></span></label></div>
 <div class="bx"><h3>ความเป็นส่วนตัว</h3><p class="mu">ข้อมูลการฝึกเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ไม่มีบัญชี ไม่ส่งข้อมูลหรือภาพไปเซิร์ฟเวอร์ หากล้างข้อมูลเบราว์เซอร์ ประวัติจะหายไป</p><button class="dg w" id="clr">ลบข้อมูลในเครื่องทั้งหมด</button></div>
 <div class="note">PIZZA เป็นเครื่องมือสนับสนุนกิจกรรม ไม่ใช่เครื่องมือวินิจฉัยหรือรักษาโรค ภาพสาธิตเป็นต้นแบบที่ยังไม่ผ่านการตรวจสอบโดยผู้เชี่ยวชาญ</div>`}
};
const TARGET=5,STITLE={detail:1,session:1,done:1};
function after(){
 const p=R.p,e=exOf(R.id),pv=$("#pv");
 document.querySelectorAll("[data-th]").forEach(x=>thumb(x,exOf(x.dataset.th)));
 if(p=="onb"&&pv){const x=EX[R.ob==2?2:R.ob==1?1:0];player(pv,x,{ctl:false,mini:true})}
 if(p=="detail")player(pv,e,{speak:false});
 if(p=="session"){
  if(!SESS){const ck=[...document.querySelectorAll(".ck")],b=$("#st");ck.forEach(c=>c.onchange=()=>b.disabled=!ck.every(x=>x.checked));b.onclick=()=>{SESS={ex:e.id,start:new Date().toISOString(),el:0,reps:0,paused:false};render()};return}
  let ctl;const fin=st=>{const s=SESS;SESS=null;stopAll();DB.sessions.push({ex:s.ex,start:s.start,dur:Math.round(s.el),reps:s.reps,status:st});save();speak(st=="completed"?"จบการฝึกแล้ว ทำได้ดีมาก":"บันทึกการฝึกแล้ว");go("done")};
  ctl=player(pv,e,{ctl:false,speak:true,onLoop(){if(SESS&&!SESS.paused){SESS.reps++;$("#rp2").textContent=SESS.reps+"/"+TARGET;$("#pg").style.width=Math.min(100,SESS.reps/TARGET*100)+"%";speak("ครั้งที่ "+SESS.reps);if(SESS.reps>=TARGET)fin("completed")}}});
  TICK=setInterval(()=>{if(SESS&&!SESS.paused){SESS.el+=.25;$("#tm").textContent=fmt(SESS.el)}},250);
  $("#ps").onclick=()=>{SESS.paused=!SESS.paused;SESS.paused?ctl.pause():ctl.resume();$("#ps").textContent=SESS.paused?"ทำต่อ":"หยุดชั่วคราว"};
  $("#en").onclick=async()=>{ctl.pause();SESS.paused=true;if(await ask("จบการฝึกตอนนี้? ระบบจะบันทึกตามที่ทำจริง","จบการฝึก"))fin(SESS.reps>=TARGET?"completed":"stopped");else{SESS.paused=false;ctl.resume();$("#ps").textContent="หยุดชั่วคราว"}};
 }
 if(p=="set"){$("#nm").oninput=ev=>{DB.set.name=ev.target.value;save()};$("#vc").onchange=ev=>{DB.set.voice=ev.target.checked;save()};
  $("#fs").onclick=ev=>{const v=ev.target.dataset.v;if(!v)return;DB.set.fs=+v;save();document.documentElement.style.fontSize=v*100+"%";[...$("#fs").children].forEach(b=>b.classList.toggle("on",b==ev.target))};
  $("#clr").onclick=async()=>{if(await ask("ลบประวัติและการตั้งค่าทั้งหมดในเครื่องนี้? ไม่สามารถกู้คืนได้","ลบทั้งหมด")){DB={sessions:[],set:{fs:1,voice:true,name:"",onb:false}};try{localStorage.removeItem(KEY)}catch(x){}document.documentElement.style.fontSize="100%";R.ob=0;go("onb")}}}
}
function render(){
 stopAll();speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
 if(!DB.set.onb&&R.p!="onb")R.p="onb";
 if(R.p!="session"&&R.p!="done")SESS=null;
 if(!PG[R.p])R.p="home";
 const m=$("#main");m.innerHTML=PG[R.p]();
 const on=R.p=="onb";$("#nav").style.display=on?"none":"";if(on)m.style.marginLeft="auto";else m.style.marginLeft="";
 $("#nav").innerHTML=NAV.map(n=>`<button data-go="${n[0]}" class="${(R.p==n[0]||(["detail","session","done"].includes(R.p)&&n[0]=="lib"))?"on":""}" aria-label="${n[1]}"><svg viewBox="0 0 24 24"><path d="${n[2]}"/></svg>${n[1]}</button>`).join("");
 after();scrollTo(0,0);m.focus({preventScroll:true});
}
document.addEventListener("click",async e=>{
 const g=e.target.closest("[data-go]");if(g){const [p,id]=g.dataset.go.split(":");
  if(SESS&&R.p=="session"&&p!="session"){if(!(await ask("กำลังฝึกอยู่ ต้องการออกและบันทึกตามที่ทำจริงหรือไม่?","ออกและบันทึก")))return;DB.sessions.push({ex:SESS.ex,start:SESS.start,dur:Math.round(SESS.el),reps:SESS.reps,status:"stopped"});save();SESS=null}
  go(p,id);return}
 const a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act=="obn"){if(R.ob<2){R.ob++;render()}else{DB.set.onb=true;save();go("home")}}
 if(a.dataset.act=="obb"){R.ob--;render()}
});
document.documentElement.style.fontSize=(DB.set.fs||1)*100+"%";
render();
</script>
</body>
</html>
